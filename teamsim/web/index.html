<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>teamsim run</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>teamsim</h1>
  <form id="controls" autocomplete="off">
    <label>Pack <select id="pack"></select></label>
    <label>Bot <select id="subject"></select></label>
    <button type="submit" id="run">Run</button>
    <button type="button" id="validate">Check the checks</button>
  </form>
  <p id="status" role="status"></p>
</header>
<main>
  <section id="summary" hidden>
    <h2>Run</h2>
    <p id="purpose"></p>
    <ul id="facts-line" class="plain"></ul>
    <p id="digest"></p>
    <details><summary>Limits of this pack</summary><ul id="limits"></ul></details>
  </section>
  <section id="checks-section" hidden>
    <h2>Checks</h2>
    <ul id="checks" class="plain"></ul>
  </section>
  <section id="timeline-section" hidden>
    <h2>Timeline</h2>
    <div class="toolbar">
      <label>Show
        <select id="filter">
          <option value="key">planted facts, questions and bot replies</option>
          <option value="all">all messages</option>
        </select>
      </label>
      <label>Place <select id="place"><option value="">all places</option></select></label>
      <span id="count"></span>
    </div>
    <div id="timeline" class="scroll"></div>
  </section>
  <section id="users-section" hidden>
    <h2>Users</h2>
    <div class="scroll"><table id="users"></table></div>
  </section>
  <section id="matrix-section" hidden>
    <h2>Control matrix</h2>
    <p id="matrix-note"></p>
    <div class="scroll"><table id="matrix"></table></div>
    <ul id="mismatches"></ul>
  </section>
</main>
<script src="/app.js"></script>
</body>
</html>
