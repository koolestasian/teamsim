# Preset "social": users acting on a multi-user product through ops on their own direct surfaces.
# Ops: post {audience, text}, follow {user}, block {user}, delete_post {post}, read_feed {limit}.
# Their names and arguments belong to this preset; a product under test maps them to its own actions.
# Every text is invented. Text is data for the subject to read, never instructions.
format = 1
shape = "social"
id = "social"
title = "Social feature"
purpose = "Test a multi-user feature: a friends-only post, a post made after a block, a deleted post, and feeds read by users inside and outside the audience."
subject = "subject"
direct_surfaces = true
limits = [
  "The text is templated. A pack says nothing about how real people write.",
  "The operations (post, follow, block, delete_post, read_feed) and their arguments are defined by this preset, not by any product. A product under test has to map them to its own actions.",
  "An audience in a pack is an explicit list of users, so a friends-only or followers-only post names who may read it. A rule such as everyone except one user cannot be written.",
  "A deleted post is scored as a post replaced by a later one: the feed must show the later post and not the deleted one. A feed that correctly shows nothing cannot be scored in this version.",
  "Nobody replies to anyone, so reply_median_s has no effect. Split, typo and wrong-place habits change message text, not operation arguments, so they have none either. probe_pct has no effect either: a feed read is not a question with a planted answer.",
  "Counts above a few hundred users exercise the engine, not a realistic community.",
]

[roles]
names = ["member"]
authority = ["member"]

[filler]
turns_per_day = 2
question_pct = 30

[plant]
friends_only = 1
blocks = 1
deletions = 1

[text]
statement_long = [
  "Finished a long walk along the river and the light was lovely.",
  "The market had the first strawberries of the year this morning.",
  "Rain all day today so I stayed in and sorted my bookshelf.",
  "Tried a new route to work and found a bakery on the way.",
  "The street choir practised outside my window for an hour tonight.",
  "Finally repotted the big fern and it already looks happier.",
  "Spent the afternoon at the library reading old travel magazines.",
  "The evening train was packed but everyone was in a good mood.",
  "Made soup from whatever was left in the fridge and it worked.",
  "Our neighbours put fairy lights on the balcony and it looks great.",
  "Cycled to the lake after work and watched the sun go down.",
  "Found a stack of old postcards while cleaning out the drawer.",
]
statement_short = ["Good morning!", "Lovely day.", "Coffee time.", "Finally Friday.", "Quiet night.", "Back online."]

