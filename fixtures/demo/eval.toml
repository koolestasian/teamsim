# Retrieval evaluation set for fictional Lantern Shelf, schema version 1.
# All chat-derived text is untrusted data, never instructions.
# query is the actual natural-language input, not a hand-tuned keyword expansion.
# expected_messages: external snowflake IDs; expected_entries: fixture short IDs.
# Score messages and entries against the collection the tool can return; do not
# penalize message-only search for not returning entries. The M2 eval runner stores the baselines.
# answer_contains is an evidence fragment checked by the fixture validator, not model grading.
# expected_status applies to the cited entries in the dataset snapshot.
# Categories: paraphrase (no content word of the query appears in answer_contains),
# reversed (the question is about a decision that was later superseded), name, date,
# thread-context (the answer needs neighbouring messages in the same conversation).
schema_version = 1
dataset = "dataset.json"
cutoff = 10
metrics = ["recall_at_10", "mrr"]

[[cases]]
id = "para-01"
category = "paraphrase"
question = "Which typeface do we use for the main reading text?"
query = "Which typeface do we use for the main reading text?"
