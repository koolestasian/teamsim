format = 1
id = "social-10"
title = "Social feature: 10 synthetic users, 21 days"
purpose = "Test a multi-user feature: a friends-only post, a post made after a block, a deleted post, and feeds read by users inside and outside the audience."
seed = "social-ten-1"
limits = ["The text is templated. A pack says nothing about how real people write.", "The operations (post, follow, block, delete_post, read_feed) and their arguments are defined by this preset, not by any product. A product under test has to map them to its own actions.", "An audience in a pack is an explicit list of users, so a friends-only or followers-only post names who may read it. A rule such as everyone except one user cannot be written.", "A deleted post is scored as a post replaced by a later one: the feed must show the later post and not the deleted one. A feed that correctly shows nothing cannot be scored in this version.", "Nobody replies to anyone, so reply_median_s has no effect. Split, typo and wrong-place habits change message text, not operation arguments, so they have none either.", "Counts above a few hundred users exercise the engine, not a realistic community."]

